<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Viewer — Editor & Pratinjau Markdown</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#0b0f19;--bar:#090d15;--pv:#0b1020;--bd:#1f2937;--ac:#3b82f6}
html,body{height:100%}
body{font-family:Inter,system-ui,'Segoe UI',sans-serif;background:var(--bg);color:#cbd5e1;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a3344;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.tab{display:flex;align-items:center;gap:8px;height:100%;padding:0 14px;cursor:pointer;color:#8b95a7;border-right:1px solid var(--bd);border-top:2px solid transparent;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.tab:hover{background:#111827}.tab.on{background:var(--bg);color:#fff;border-top-color:var(--ac)}
.tab .x{opacity:0;font-size:11px;padding:3px 5px;border-radius:4px}.tab:hover .x,.tab.on .x{opacity:.7}.tab .x:hover{background:#374151;opacity:1}
.tb{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:#8b95a7}
.tb:hover{color:#fff;background:rgba(255,255,255,.08)}.tb.on{color:#fff;background:rgba(255,255,255,.12)}
#ta,#gn{font:13px/20px 'Fira Code',Consolas,Menlo,monospace;padding:12px 0;margin:0;tab-size:2}
#ta{white-space:pre;overflow:auto;color:#d6deeb;caret-color:#fff;padding-left:14px;padding-right:14px}
#gn{text-align:right;color:#4b5563;padding-right:12px;user-select:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;text-align:left;font-size:13px;white-space:nowrap}.mi:hover{background:#1f2937}.mi i{width:16px;text-align:center;color:#8b95a7}
/* Tampilan hasil Markdown */
#mdcss{display:none}
.md{font-size:16px;line-height:1.7;color:#e6edf3;word-wrap:break-word}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-weight:700;line-height:1.25;margin:1.6em 0 .6em;color:#fff}
.md h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid #263041}.md h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid #263041}
.md h3{font-size:1.25em}.md h4{font-size:1em}.md h5{font-size:.875em}.md h6{font-size:.85em;color:#8b95a7}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:0 0 1em}
.md ul{list-style:disc}.md ol{list-style:decimal}.md ul,.md ol{padding-left:2em}.md ul ul{list-style:circle}.md ul ul ul{list-style:square}
.md li.task{list-style:none;margin-left:-1.4em}.md li.task input{margin-right:.4em;accent-color:#3b82f6}
.md a{color:#58a6ff}.md a:hover{text-decoration:underline}
.md code{background:rgba(110,118,129,.25);padding:.15em .4em;border-radius:6px;font-size:85%;font-family:'Fira Code',Consolas,monospace}
.md pre{background:#0d1117;border:1px solid #263041;border-radius:8px;padding:14px 16px;overflow:auto}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55;white-space:pre;color:#d6deeb}
.md blockquote{border-left:4px solid #3b82f6;padding:.2em 1em;color:#9aa6b8;background:rgba(59,130,246,.06);border-radius:0 6px 6px 0}
.md blockquote>:last-child{margin-bottom:0}
.md hr{border:0;border-top:1px solid #263041;margin:1.8em 0}
.md table{border-collapse:collapse;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid #263041;padding:6px 13px}.md th{background:#111827;font-weight:600}.md tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.md img{max-width:100%;border-radius:6px}.md del{opacity:.7}
</style>
</head>
<body class="flex flex-col">

<!-- Bar tab -->
<div class="h-10 flex items-stretch shrink-0 border-b" style="background:var(--bar);border-color:var(--bd)">
  <div id="tabs" class="flex items-stretch overflow-x-auto"></div>
  <button id="add" class="w-10 grid place-items-center text-slate-400 hover:text-white hover:bg-white/5 flex-none" title="Tab baru"><i class="fa-solid fa-plus"></i></button>
</div>

<!-- Area kerja -->
<div id="main" class="flex-1 min-h-0 relative flex">
  <section id="pE" class="flex min-w-0" style="background:var(--bg)">
    <div id="gut" class="overflow-hidden shrink-0 w-14"><pre id="gn"></pre></div>
    <textarea id="ta" class="flex-1 min-w-0 bg-transparent outline-none resize-none" spellcheck="false" wrap="off" placeholder="Tulis atau tempel Markdown di sini…"></textarea>
  </section>
  <div id="spl" class="w-1 shrink-0 cursor-col-resize hover:bg-blue-500/60" style="background:var(--bd);touch-action:none"></div>
  <section id="pV" class="flex-1 min-w-0 flex flex-col" style="background:var(--pv)">
    <div class="h-8 shrink-0 flex items-center justify-between px-4 text-[11px] font-semibold tracking-wider text-slate-500 border-b" style="border-color:var(--bd)">
      <span>PREVIEW</span><span id="info" class="font-normal tracking-normal"></span>
    </div>
    <div id="pv" class="flex-1 overflow-auto"><article id="md" class="md max-w-3xl mx-auto px-6 py-8"></article></div>
  </section>

  <!-- Toolbar melayang -->
  <div id="bar" class="absolute z-20 flex items-center gap-0.5 p-1 rounded-full border shadow-2xl" style="left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.92);border-color:#2a3344;backdrop-filter:blur(6px)">
    <button id="grip" class="tb cursor-grab" style="touch-action:none" title="Geser toolbar"><i class="fa-solid fa-grip-vertical"></i></button>
    <button class="tb" data-m="code" title="Hanya editor"><i class="fa-solid fa-code"></i></button>
    <button class="tb" data-m="view" title="Hanya pratinjau"><i class="fa-solid fa-eye"></i></button>
    <button class="tb" data-m="split" title="Editor + pratinjau"><i class="fa-solid fa-table-columns"></i></button>
    <span class="w-px h-5 mx-1" style="background:#2a3344"></span>
    <div class="relative">
      <button id="mbtn" class="tb" title="Menu"><i class="fa-solid fa-bars"></i></button>
      <div id="menu" class="hidden absolute right-0 top-full mt-2 py-1 rounded-lg border shadow-2xl z-30" style="background:#111827;border-color:#2a3344">
        <button class="mi" data-a="new"><i class="fa-solid fa-plus"></i>Tab baru</button>
        <button class="mi" data-a="open"><i class="fa-solid fa-folder-open"></i>Buka file .md</button>
        <button class="mi" data-a="save"><i class="fa-solid fa-download"></i>Simpan .md <span class="ml-auto text-slate-500 text-xs">Ctrl+S</span></button>
        <button class="mi" data-a="html"><i class="fa-solid fa-file-code"></i>Ekspor sebagai HTML</button>
        <button class="mi text-red-400" data-a="reset"><i class="fa-solid fa-trash !text-red-400"></i>Hapus semua data</button>
      </div>
    </div>
  </div>
</div>
<input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple class="hidden">

<script>
$(function(){
  const KEY='mdview.v1';
  const SAMPLE=['# Halo, Markdown! 👋','','Tempel isi **README.md** kamu di editor, hasilnya langsung tampil di sebelah kanan.','',
  '## Fitur','','- [x] Banyak tab, tersimpan otomatis di `localStorage`','- [x] Buka file `.md` (atau seret ke halaman ini)','- [ ] Dukung *italic*, **tebal**, ~~coret~~, dan [tautan](https://netlify.com)','',
  '1. Klik **+** untuk tab baru','2. Klik dua kali nama tab untuk mengganti nama','   - Ctrl+S untuk menyimpan sebagai file','','> Geser toolbar bulat di tengah, atau tarik garis pemisah untuk mengubah lebar panel.','',
  '```js','console.log("Halo dari MD Viewer");','```','','| Tombol | Fungsi |','|:--|:-:|','| Tab | Sisipkan 2 spasi |','| Ctrl+S | Simpan .md |','','---','','Selesai. Selamat menulis!'].join('\n');

  let st=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tabs)&&d.tabs.length)return d;}catch(e){}return null;})()
        ||{tabs:[{id:1,name:'README.md',text:SAMPLE}],active:1,mode:'split',ratio:50,nid:2};
  if(!st.tabs.some(t=>t.id===st.active))st.active=st.tabs[0].id;
  const cur=()=>st.tabs.find(t=>t.id===st.active);

  /* ---------- Parser Markdown ---------- */
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const url=u=>/^\s*(javascript|vbscript):|^\s*data:(?!image\/)/i.test(u)?'#':u.trim();
  const slug=t=>t.replace(/<[^>]+>/g,'').toLowerCase().replace(/[^\w\u00C0-\uFFFF\s-]/g,'').trim().replace(/\s+/g,'-');
  function inl(s){
    const c=[];s=esc(s).replace(/`([^`]+)`/g,(_,x)=>'\u0001'+(c.push(x)-1)+'\u0002');
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;(.*?)&quot;)?\)/g,(_,a,u,t)=>'<img alt="'+a+'" src="'+url(u)+'"'+(t?' title="'+t+'"':'')+'>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;(.*?)&quot;)?\)/g,(_,a,u)=>'<a href="'+url(u)+'"'+(/^https?:/i.test(u)?' target="_blank" rel="noopener"':'')+'>'+a+'</a>')
      .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*|__(.+?)__/g,(_,a,b)=>'<strong>'+(a||b)+'</strong>')
      .replace(/\*(?!\s)(.+?)\*|\b_(?!\s)(.+?)_\b/g,(_,a,b)=>'<em>'+(a||b)+'</em>')
      .replace(/~~(.+?)~~/g,'<del>$1</del>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s.replace(/\u0001(\d+)\u0002/g,(_,n)=>'<code>'+c[n]+'</code>');
  }
  function list(items){
    let h='',k=[];
    items.forEach(it=>{
      const tag=/\d/.test(it.mk[0])?'ol':'ul';
      while(k.length&&it.ind<k[k.length-1].ind)h+='</li></'+k.pop().tag+'>';
      if(!k.length||it.ind>k[k.length-1].ind){h+='<'+tag+'>';k.push({ind:it.ind,tag});}else h+='</li>';
      const tk=/^\[([ xX])\]\s+(.*)$/.exec(it.tx);
      h+=tk?'<li class="task"><input type="checkbox" disabled'+(tk[1]!==' '?' checked':'')+'> '+inl(tk[2]):'<li>'+inl(it.tx);
    });
    while(k.length)h+='</li></'+k.pop().tag+'>';
    return h;
  }
  function md(src){
    const L=src.replace(/\r\n?/g,'\n').split('\n'),out=[],blank=l=>!l.trim();let i=0;
    const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/,HR=/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/,H=/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/,FN=/^\s*(```|~~~)\s*([\w+#-]*)/,TS=/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
    const start=l=>H.test(l)||HR.test(l)||FN.test(l)||/^\s*>/.test(l)||LI.test(l);
    const cells=r=>r.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
    while(i<L.length){
      const l=L[i];let m;
      if(blank(l)){i++;continue;}
      if(m=FN.exec(l)){const f=m[1],b=[];i++;while(i<L.length&&!L[i].trim().startsWith(f)){b.push(L[i]);i++;}i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue;}
      if(m=H.exec(l)){out.push('<h'+m[1].length+' id="'+slug(m[2])+'">'+inl(m[2])+'</h'+m[1].length+'>');i++;continue;}
      if(HR.test(l)){out.push('<hr>');i++;continue;}
      if(l.includes('|')&&i+1<L.length&&L[i+1].includes('|')&&TS.test(L[i+1])){
        const hd=cells(l),al=cells(L[i+1]).map(c=>/^:-+:$/.test(c)?'center':/-:$/.test(c)?'right':/^:-/.test(c)?'left':''),rows=[];i+=2;
        while(i<L.length&&!blank(L[i])&&L[i].includes('|')){rows.push(cells(L[i]));i++;}
        const td=(c,j,t)=>'<'+t+(al[j]?' style="text-align:'+al[j]+'"':'')+'>'+inl(c)+'</'+t+'>';
        out.push('<table><thead><tr>'+hd.map((c,j)=>td(c,j,'th')).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+hd.map((_,j)=>td(r[j]||'',j,'td')).join('')+'</tr>').join('')+'</tbody></table>');continue;
      }
      if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*> ?/,''));i++;}out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue;}
      if(LI.test(l)){
        const it=[];
        while(i<L.length&&(LI.test(L[i])||(blank(L[i])&&i+1<L.length&&LI.test(L[i+1])))){
          if(!blank(L[i])){const x=LI.exec(L[i]);it.push({ind:x[1].replace(/\t/g,'    ').length,mk:x[2],tx:x[3]});}i++;
        }
        out.push(list(it));continue;
      }
      const b=[l];i++;while(i<L.length&&!blank(L[i])&&!start(L[i])){b.push(L[i]);i++;}
      out.push('<p>'+inl(b.map(x=>x.trim()).join(' '))+'</p>');
    }
    return out.join('\n');
  }

  /* ---------- Tampilan ---------- */
  let lastN=0,pvT=null;
  function renderTabs(){
    const $t=$('#tabs').empty();
    st.tabs.forEach(t=>{
      const $e=$('<div class="tab"><i class="fa-brands fa-markdown text-sky-400"></i><span class="nm"></span><button class="x" title="Tutup tab"><i class="fa-solid fa-xmark"></i></button></div>')
        .data('id',t.id).toggleClass('on',t.id===st.active);
      $e.find('.nm').text(t.name);$t.append($e);
    });
    const a=$t.find('.on')[0];if(a)a.scrollIntoView({block:'nearest',inline:'nearest'});
  }
  function gutter(){
    const n=$('#ta').val().split('\n').length;
    if(n!==lastN){lastN=n;$('#gn').text(Array.from({length:n},(_,i)=>i+1).join('\n'));}
    $('#gut').scrollTop($('#ta').scrollTop());
  }
  function preview(){
    const t=cur().text;$('#md').html(md(t));
    const w=t.trim()?t.trim().split(/\s+/).length:0;
    $('#info').text(w+' kata · '+t.split('\n').length+' baris'+($('#info').data('sv')||''));
  }
  const prevSoon=()=>{clearTimeout(pvT);pvT=setTimeout(preview,120);};
  function loadEditor(){lastN=0;$('#ta').val(cur().text);gutter();preview();$('#pv').scrollTop(0);}
  function mode(){
    let m=st.mode;if(innerWidth<768&&m==='split')m='code';
    $('#pE').toggle(m!=='view').css('flex',m==='split'?'0 0 '+st.ratio+'%':'1 1 0');
    $('#pV').toggle(m!=='code');$('#spl').toggle(m==='split');
    $('#bar [data-m]').each(function(){$(this).toggleClass('on',$(this).data('m')===st.mode);});
  }

  /* ---------- Simpan otomatis ---------- */
  let svT=null;
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(st));$('#info').data('sv',' · tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));}
    catch(e){$('#info').data('sv',' · gagal menyimpan (penyimpanan penuh)');}
    preview();
  }
  const save=()=>{clearTimeout(svT);svT=setTimeout(persist,400);};
  $(window).on('beforeunload pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}});

  /* ---------- Tab ---------- */
  function newTab(name,text){
    const id=st.nid++;st.tabs.push({id,name:name||'Untitled-'+id+'.md',text:text||''});
    st.active=id;renderTabs();loadEditor();persist();$('#ta').focus();
  }
  $('#add').click(()=>newTab());
  $('#tabs').on('click','.tab',function(e){
    const id=$(this).data('id');if($(e.target).closest('.x').length)return;
    if(id!==st.active){st.active=id;renderTabs();loadEditor();persist();}
  }).on('click','.x',function(e){
    e.stopPropagation();const id=$(this).closest('.tab').data('id'),i=st.tabs.findIndex(t=>t.id===id),t=st.tabs[i];
    if(t.text.trim()&&!confirm('Tutup "'+t.name+'"? Isinya akan dihapus.'))return;
    st.tabs.splice(i,1);
    if(!st.tabs.length){const nid=st.nid++;st.tabs.push({id:nid,name:'Untitled-'+nid+'.md',text:''});}
    if(!st.tabs.some(x=>x.id===st.active))st.active=st.tabs[Math.max(0,i-1)].id;
    renderTabs();loadEditor();persist();
  }).on('dblclick','.tab',function(){
    const t=st.tabs.find(x=>x.id===$(this).data('id')),n=prompt('Nama tab:',t.name);
    if(n&&n.trim()){t.name=n.trim().slice(0,60);renderTabs();persist();}
  });

  /* ---------- Editor ---------- */
  $('#ta').on('input',function(){cur().text=this.value;gutter();prevSoon();save();})
    .on('scroll',function(){
      $('#gut').scrollTop(this.scrollTop);
      if(st.mode==='split'&&innerWidth>=768){const r=this.scrollTop/Math.max(1,this.scrollHeight-this.clientHeight),p=$('#pv')[0];p.scrollTop=r*(p.scrollHeight-p.clientHeight);}
    })
    .on('keydown',function(e){
      if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey){
        e.preventDefault();
        if(!document.execCommand('insertText',false,'  ')){const s=this.selectionStart;this.setRangeText('  ',s,this.selectionEnd,'end');$(this).trigger('input');}
      }
    });
  $('#md').on('click','a[href^="#"]',function(e){
    e.preventDefault();const el=document.getElementById(decodeURIComponent($(this).attr('href').slice(1)));if(el)el.scrollIntoView({behavior:'smooth'});
  });

  /* ---------- Toolbar, mode, panel ---------- */
  $('#bar [data-m]').click(function(){st.mode=$(this).data('m');mode();persist();});
  $('#mbtn').click(e=>{e.stopPropagation();$('#menu').toggleClass('hidden');});
  $(document).on('click',()=>$('#menu').addClass('hidden'));
  let tb=null,sp=false;
  $('#grip').on('pointerdown',function(e){
    const r=$('#bar')[0].getBoundingClientRect(),m=$('#main')[0].getBoundingClientRect();
    tb={dx:e.clientX-r.left,dy:e.clientY-r.top};$('#bar').css({left:r.left-m.left,top:r.top-m.top,transform:'none'});e.preventDefault();
  });
  $('#spl').on('pointerdown',e=>{sp=true;e.preventDefault();});
  $(window).on('pointermove',e=>{
    const m=$('#main')[0].getBoundingClientRect();
    if(tb){const b=$('#bar')[0];$('#bar').css({left:Math.min(Math.max(0,e.clientX-m.left-tb.dx),m.width-b.offsetWidth),top:Math.min(Math.max(0,e.clientY-m.top-tb.dy),m.height-b.offsetHeight)});}
    if(sp){st.ratio=Math.min(85,Math.max(15,(e.clientX-m.left)/m.width*100));mode();}
  }).on('pointerup',()=>{if(sp)persist();tb=null;sp=false;}).on('resize',mode);

  /* ---------- File: buka, simpan, ekspor ---------- */
  function download(name,text,type){
    const u=URL.createObjectURL(new Blob([text],{type}));$('<a>').attr({href:u,download:name})[0].click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  function openFiles(fs){
    [...fs].forEach(f=>{
      if(f.size>5*1024*1024){alert('"'+f.name+'" terlalu besar (maksimal 5 MB).');return;}
      f.text().then(t=>newTab(f.name,t));
    });
  }
  $('#file').on('change',function(){openFiles(this.files);this.value='';});
  $(window).on('dragover',e=>e.preventDefault()).on('drop',e=>{e.preventDefault();openFiles(e.originalEvent.dataTransfer.files);});
  function saveMd(){const t=cur();download(/\.(md|markdown|txt)$/i.test(t.name)?t.name:t.name+'.md',t.text,'text/markdown');}
  $('#menu').on('click','[data-a]',function(){
    const a=$(this).data('a');$('#menu').addClass('hidden');
    if(a==='new')newTab();
    else if(a==='open')$('#file').click();
    else if(a==='save')saveMd();
    else if(a==='html'){
      const t=cur();
      download(t.name.replace(/\.\w+$/,'')+'.html','<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t.name)+'</title><style>body{margin:0;background:#0b1020;font-family:system-ui,sans-serif}.md{max-width:820px;margin:0 auto;padding:32px 20px}'+$('#mdcss').text()+'</style></head><body><article class="md">'+md(t.text)+'</article></body></html>','text/html');
    }
    else if(a==='reset'&&confirm('Hapus SEMUA tab dan isinya dari penyimpanan browser?')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}
  });
  $(window).on('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveMd();}});

  /* ---------- Mulai ---------- */
  $('#mdcss').text($('style').first().text().split('/* Tampilan hasil Markdown */')[1]||'');
  renderTabs();loadEditor();mode();
});
</script>
<style id="mdcss"></style>
</body>
</html>
